<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Browser AI Runtime — Phase 0 検証</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#0b0f14" />
  <!-- iOS standalone PWA 用 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BAI Phase0" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: max(env(safe-area-inset-top), 16px) 16px 32px;
      background: #0b0f14; color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      line-height: 1.5;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: #8b98a5; font-size: 12px; margin-bottom: 16px; }
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 999px;
      background: #1f6feb22; border: 1px solid #1f6feb; color: #79c0ff;
      font-size: 12px; font-weight: 600;
    }
    #env { font-size: 12px; margin: 12px 0; border: 1px solid #21262d; border-radius: 10px; padding: 8px 12px; }
    #env > div { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; border-bottom: 1px solid #161b22; }
    #env > div:last-child { border-bottom: 0; }
    #env .k { color: #8b98a5; }
    #env .v { text-align: right; word-break: break-all; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    button {
      appearance: none; border: 1px solid #30363d; background: #21262d; color: #e6edf3;
      padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { background: #30363d; }
    button.primary { background: #1f6feb; border-color: #1f6feb; }
    button.wide { grid-column: 1 / -1; }
    #log {
      white-space: pre-wrap; font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px; background: #010409; border: 1px solid #21262d; border-radius: 10px;
      padding: 12px; height: 42vh; overflow-y: auto; margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>Browser AI Runtime — Phase 0</h1>
  <div class="sub">技術検証スパイク: iOS PWA で GPU 学習ループ + 永続化/復元</div>
  <div>backend: <span class="badge" id="backendKind">…</span></div>

  <div id="env"></div>

  <div class="btns">
    <button class="primary wide" id="btnTrain">学習 500 step（loss が下がるか）</button>
    <button id="btnSave">保存</button>
    <button id="btnRestore">復元して継続</button>
    <button class="wide" id="btnSelfTest">自己テスト: 保存→読込→bit一致 ✅</button>
    <button id="btnForceCpu">フォールバック強制（CPU）</button>
    <button id="btnReset">リセット</button>
  </div>

  <div id="log"></div>

  <script type="module" src="./src/probe/main.js"></script>
</body>
</html>
