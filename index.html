<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Browser AI Runtime</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BAI Runtime" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: max(env(safe-area-inset-top), 24px) 20px 40px;
      background: #0b0f14; color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; line-height: 1.6;
    }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
    header img { width: 40px; height: 40px; }
    h1 { font-size: 20px; margin: 0; }
    .sub { color: #8b98a5; font-size: 13px; margin: 4px 0 20px; }
    a.card {
      display: block; text-decoration: none; color: inherit;
      border: 1px solid #21262d; border-radius: 14px; padding: 16px; margin-bottom: 12px;
      background: #0f141b; -webkit-tap-highlight-color: transparent;
    }
    a.card:active { background: #161b22; }
    .card .row { display: flex; align-items: center; justify-content: space-between; }
    .card .name { font-size: 16px; font-weight: 700; }
    .card .desc { color: #8b98a5; font-size: 13px; margin-top: 2px; }
    .status { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    .ok { background: #23863622; color: #3fb950; border: 1px solid #238636; }
    .cur { background: #1f6feb22; color: #79c0ff; border: 1px solid #1f6feb; }
    .todo { background: #6e768122; color: #8b98a5; border: 1px solid #30363d; }
    .arrow { color: #6e7681; }
    footer { color: #6e7681; font-size: 12px; margin-top: 20px; }
    footer a { color: #79c0ff; }
  </style>
</head>
<body>
  <header>
    <img src="./icon.svg" alt="" />
    <h1>Browser AI Runtime</h1>
  </header>
  <div class="sub">完全クライアントサイドの自己成長型 AI 実行基盤（研究プロジェクト）</div>

  <a class="card" href="./phase2.html">
    <div class="row">
      <div><span class="name">Phase 2a</span> <span class="arrow">›</span>
        <div class="desc">Cognitive Core（次文字予測）＋ 学習ループの閉じ（驚きで記憶）</div>
      </div>
      <span class="status cur">いまここ</span>
    </div>
  </a>

  <a class="card" href="./phase1.html">
    <div class="row">
      <div><span class="name">Phase 1</span> <span class="arrow">›</span>
        <div class="desc">Representation ＋ Memory Fabric（学習・記銘・想起・忘却）</div>
      </div>
      <span class="status ok">合格</span>
    </div>
  </a>

  <a class="card" href="./phase0.html">
    <div class="row">
      <div><span class="name">Phase 0</span> <span class="arrow">›</span>
        <div class="desc">技術検証: GPU 学習ループ ＋ 永続化/復元</div>
      </div>
      <span class="status ok">合格</span>
    </div>
  </a>

  <footer>
    完全ローカル実行（サーバー/AI API なし）。
    <a href="https://github.com/tenma2066-tech/Browser-AI-Runtime">GitHub</a>
  </footer>

  <script>
    // 開発中はネットワーク優先で最新を確実に取得する（下記 sw.js と同方針）
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
</body>
</html>
